# TOOL 3 CONFIGURATION
# Hardware:
#  TZ V6 3.0
#  3010 hotend fan

####################
# Tool3 Variables
[gcode_macro _VARIABLES_T3]
# Absolute pickup moves in XYZ coordinates + speed (MUST HAVE 4 fields!!)
# Accept any number of moves
# Macros accepted other than coordinates
# If using same axis position as previous move, use -128

variable_pickup_approachlocation: [306.5,100,-128,700] # Absolute pickup location in XYZ coordinates + speed
variable_pickup_moves: ["DOCKSLIDE_DEPLOY",
                        "-128,51,-128,700",
                        "303.5,-128,-128,200",
                        "-128,37,-128,200",
                        "306.5,-128,-128,200",
                        "-128,100,-128,700",
                        "DOCKSLIDE_PARK"]

variable_dropoff_approachlocation: [306.5,100,-128,700] # Absolute dropoff location in XYZ coordinates + speed
variable_dropoff_moves: ["DOCKSLIDE_DEPLOY",
                        "-128,36.5,-128,700",
                        "303.5,-128,-128,200",
                        "-128,51,-128,100",
                        "306.5,-128,-128,200",
                        "-128,100,-128,700",
                        "DOCKSLIDE_PARK"]

variable_xoffset: 0              # For tool 0, offsets are all 0
variable_yoffset: 0              # 
variable_zoffset: 0              # 
variable_shaperfreq_x: 69.4      # Tool 3 input shaper
variable_shaperfreq_y: 57.0      # 
variable_shapertype_x: "mzv"     # 
variable_shapertype_y: "ei"      # 

# End of section options
#######################################################

variable_pressure_advance: 0.0
gcode:

# Tool 3 hotend. Extrusion motion is supplied by the shared_extruder
# stepper defined in btc_carriage.cfg.
[extruder3]
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 1400.0
max_extrude_only_velocity: 75.0
max_extrude_only_accel: 8700
max_extrude_cross_section: 500
heater_pin: PB11
sensor_type: Generic 3950
sensor_pin: PF7
min_temp: 10
max_temp: 300
min_extrude_temp: 170
control = pid
pid_Kp: 16.017
pid_Ki: 0.861
pid_Kd: 74.485

[heater_fan hotend_fan3]
pin: PD13
max_power: 1.0
kick_start_time: 0.5
heater: extruder3
heater_temp: 60.0

#####################################################################
# TOOL 1 EXECUTION MACRO (Klipper accepts both T1 and t1 commands)	#
#####################################################################

[gcode_macro T3]
variable_spool_id: None
variable_active: False
gcode:
  TOOL_PICKUP TOOLNUMBER=3
