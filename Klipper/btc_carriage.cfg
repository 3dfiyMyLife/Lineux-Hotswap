##############################################################################
# Lineux Hotswap - Shared Carriage Hardware
##############################################################################
# Everything here stays mounted on the carriage permanently across every
# hotend swap: the EBB36 toolboard, the single shared extruder stepper +
# driver, the Klicky probe, the ADXL345, the part-cooling fan, and the
# status/nozzle LEDs.
#
# Per-hotend heater, thermistor, hotend fan, offsets, and input shaper
# values live in tool_0.cfg, tool_1.cfg, etc — NOT here.
##############################################################################
[mcu EBBCan]
canbus_uuid: b4c145172fb8


##############################################################################
# Carriage sense switch (single, shared)
# This is the ONLY physical presence sensor in the Hotswap design - there is
# no docksense, and no per-tool sensing. PRESSED = a hotend is on the
# carriage. RELEASED = carriage is empty. It cannot tell you WHICH hotend is
# attached - that's tracked entirely in software (see btc.cfg's
# tool_current_asperbtc / DECLARE_TOOL).
##############################################################################
[gcode_button carriage_sense]
pin: ^EBBCan:PB8
press_gcode:
  # _tool_off_EBBCan TOOLNUMBER=0
release_gcode:
  # _tool_on_EBBCan TOOLNUMBER=0
  

##############################################################################
# Shared extruder stepper driver
# Configure this ONCE only - it's the same physical driver chip regardless
# of how many [extruderN] sections reference its pins. Do NOT add a
# [tmc2209 extruder1] section too, that would double-configure one chip.
##############################################################################
[extruder_stepper shared_extruder]
extruder: extruder
step_pin: EBBCan: PD0
dir_pin: EBBCan: PD1
enable_pin: !EBBCan: PD2
microsteps: 16
rotation_distance: 55
gear_ratio: 44:10, 37:17
full_steps_per_rotation: 200

[tmc2209 extruder_stepper shared_extruder]
uart_pin: EBBCan: PA15
run_current: 1.0
interpolate: False
stealthchop_threshold: 0


##############################################################################
# Klicky probe (shared, carriage-mounted)
##############################################################################
[probe]
pin: ^EBBCan: PB9
x_offset: -4 # offset for microswitch x direction off nozzle
y_offset: -30 # offset for microswitch y direction off nozzle
z_offset = 9.017 # offset for microswitch in z height - this is a starting point only
samples: 3
sample_retract_dist: 2
samples_result: median
samples_tolerance: 1
# samples_tolerance_retries: 3
speed: 10
lift_speed: 10


##############################################################################
# Accelerometer + resonance tester (shared, carriage-mounted)
# NOTE: per-tool shaper freq values in tool_N.cfg still make sense even
# with a shared accelerometer, since a different hotend mass/geometry can
# shift the resonance profile. Re-run RESONANCE tests per hotend as usual.
##############################################################################
[adxl345]
cs_pin: carriage:PB12
spi_software_sclk_pin: carriage:PB10
spi_software_mosi_pin: carriage:PB11
spi_software_miso_pin: carriage:PB2
axes_map: x,y,z

[resonance_tester]
accel_chip: adxl345
probe_points:
    167,147,20

##############################################################################
# Shared part-cooling fan
# btc.cfg's M106/M107 overrides previously targeted partfan{toolnumber}.
# Since this fan is now shared, those two macros need a one-line edit each
# to target this single "partfan" object instead - see notes sent alongside
# this file for the exact lines to change in btc.cfg.
##############################################################################
[fan]
pin: EBBCan:PA0
max_power: 1.0
kick_start_time: 0.5
off_below: 0.1
