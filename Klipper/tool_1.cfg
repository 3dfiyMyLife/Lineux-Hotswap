# [gcode_macro Nozzle_Led_Off1]
# gcode:
#   SET_LED LED=status_led1 INDEX=2 RED=0 GREEN=0 BLUE=0 TRANSMIT=1 SYNC=0 # WHITE=0
#   SET_LED LED=status_led1 INDEX=3 RED=0 GREEN=0 BLUE=0 TRANSMIT=1 SYNC=0 # WHITE=0

[heater_fan hotend_fan1]
pin: PE5
max_power: 1.0
kick_start_time: 0.5
heater: extruder1
heater_temp: 60.0

