# TOOL 1 CONFIGURATION
# Hardware:
#  Toolhead: r2.1
#  Trianglelab CHC PRO
#  Sherpa Micro
#  Ebb 36
#  3010 hotend fan

####################
# Tool1 Variables
[gcode_macro _Variables_t1]
# Absolute pickup moves in XYZ coordinates + speed (MUST HAVE 4 fields!!)
# Accept any number of moves
# Macros accepted other than coordinates
# If using same axis position as previous move, use -128

variable_pickup_approachlocation: [144,90,-128,700] # Absolute pickup location in XYZ coordinates + speed
variable_pickup_moves: ["Dockslide_Deploy",
                        "-128,53,-128,700",
                        "140,-128,-128,400",
                        "-128,38,-128,400",
                        "144,-128,-128,400",
                        "M400",
                        # "WIPE_NOZZLE DIRECTION=-1",
                        "-128,90,-128,700",
                        "Dockslide_Park"]

variable_dropoff_approachlocation: [143,90,-128,700] # Absolute dropoff location in XYZ coordinates + speed
variable_dropoff_moves: ["Dockslide_Deploy",
                        "-128,37,-128,700",
                        "140,-128,-128,100",
                        "-128,53,-128,100",
                        "144,-128,-128,400",
                        "-128,90,-128,700",
                        "Dockslide_Park"]

variable_xoffset: -0.10             # For tool 0, offsets are all 0
variable_yoffset: 0.30            # 
variable_zoffset: -0.20              # 
variable_shaperfreq_x: 69.4      # Tool 1 input shaper
variable_shaperfreq_y: 57.0      # 
variable_shapertype_x: "mzv"     # 
variable_shapertype_y: "ei"      # 

# End of section options
#######################################################

variable_pressure_advance: 0.0
gcode:

#####################################################################
# NOTE: Per-tool carriage/dock sense buttons are removed.
# Detection is now handled globally via [gcode_button carriage_sense] 
# defined in your central config (btc_variables.cfg).
#####################################################################

#Specify which serial device this tool is:
# [mcu EBBCan]
# canbus_uuid: a90a10eb2007

# Tool 1 hotend. Extrusion motion is supplied by the shared_extruder
# stepper defined in tool_0.cfg.
[extruder1]
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 1400.0
max_extrude_only_velocity: 75.0
max_extrude_only_accel: 8700
max_extrude_cross_section: 500
heater_pin: PB11
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PF7
#pullup_resistor: 2200
min_temp: 10
max_temp: 300
min_extrude_temp: 170
control = pid
pid_Kp: 16.017
pid_Ki: 0.861
pid_Kd: 74.485

# [neopixel status_led1]
