### end Printer start routine ###

### start Check state of carriage ###
[gcode_macro Check_Carriage]
gcode:
  { action_respond_info("BTC: Check carriage start.") }
  {% set current_tool = printer["gcode_macro _btc_Variables"].tool_current_asperbtc %}
  {% set target_tool = params.TOOLNUMBER|default(current_tool)|int %}
  
  # If no active tool is set yet, default to target or 0
  {% if target_tool < 0 %}
    {% set target_tool = 0 %}
  {% endif %}

  {% set carriage_pressed = printer["gcode_button carriage_sense"].state == "PRESSED" %}

  {% if not carriage_pressed %}
    { action_respond_info("BTC: Carriage empty (sensor RELEASED)") }
    SET_GCODE_VARIABLE MACRO=_btc_Variables VARIABLE=tool_current_asperbtc VALUE=-1
    HOTSWAP_LED_EMPTY
  {% else %}
    { action_respond_info("BTC: Carriage engaged. Verifying T%d" % target_tool) }
    _CHECK_CARRIAGE_SECOND TOOLNUMBER={target_tool}
  {% endif %}
  _UPDATE_FRONTEND

[gcode_macro _checkasperbtc]
gcode:
  {% if printer["gcode_macro _btc_Variables"].tool_current_asperbtc < 0 %}
    query_probe
    _CHECK_CARRIAGE_SECOND TOOLNUMBER={params.TOOLNUMBER|default(0)|int}
  {% endif %}

[gcode_macro _CHECK_CARRIAGE_SECOND]
gcode:
    {% set toolnumber = params.TOOLNUMBER|default(0)|int %}
    {% set frompickup = params.FROMPICKUP|default(0)|int %}

    {% set toolvar = printer["gcode_macro _Variables_t" + toolnumber|string] %}
    {% set tool_xoffset = toolvar.xoffset|float %}
    {% set tool_yoffset = toolvar.yoffset|float %}
    {% set tool_zoffset = toolvar.zoffset|float %}
    {% set tool_shaperfreq_x = toolvar.shaperfreq_x %}
    {% set tool_shaperfreq_y = toolvar.shaperfreq_y %}
    {% set tool_shapertype_x = toolvar.shapertype_x %}
    {% set tool_shapertype_y = toolvar.shapertype_y %}
    {% set tool_pressure_advance = toolvar.pressure_advance|float %}

    {% set btcvar = printer["gcode_macro _btc_Variables"] %}
    {% set tool_z_hop = btcvar.btc_z_hop %}
    {% set z_adjust = btcvar.gcode_offset_z_adjust %}
    {% set tool_approachlocation_z = btcvar.tool_approachlocation_z %}

    {% set toolatcarriage = False %}

    ###################################################
    # SINGLE CARRIAGE SENSOR LOGIC
    ###################################################

    {% if btcvar.carriage_sense_switch and printer["gcode_button carriage_sense"].state == "PRESSED" %}
        {% set toolatcarriage = True %}
        HOTSWAP_LED_TOOL

    {% elif not btcvar.carriage_sense_switch and not printer.probe.last_query %}
        {% set toolatcarriage = True %}
        HOTSWAP_LED_TOOL
    {% endif %}

    ###################################################
    # TOOL DETECTED AT CARRIAGE
    ###################################################

    {% if toolatcarriage %}

        { action_respond_info("BTC: T%d at carriage" % toolnumber) }

        SET_GCODE_VARIABLE MACRO=_btc_Variables VARIABLE=tool_current_asperbtc VALUE={toolnumber}

        {% if frompickup == 1 %}
            HOTSWAP_LED_TOOL
        {% endif %}

        # Select the picked hotend, then connect the one physical extruder
        # motor to that hotend's extrusion motion queue.
        {% if toolnumber == 0 %}
            ACTIVATE_EXTRUDER EXTRUDER=extruder
            SYNC_EXTRUDER_MOTION EXTRUDER=shared_extruder MOTION_QUEUE=extruder
        {% else %}
            ACTIVATE_EXTRUDER EXTRUDER=extruder{toolnumber}
            SYNC_EXTRUDER_MOTION EXTRUDER=shared_extruder MOTION_QUEUE=extruder{toolnumber}
        {% endif %}

        # Pressure advance belongs to the one physical extruder stepper.
        SET_PRESSURE_ADVANCE EXTRUDER=shared_extruder ADVANCE={tool_pressure_advance}

        # Apply XY offsets
        {% if 'x' in printer.toolhead.homed_axes and 'y' in printer.toolhead.homed_axes %}

            SET_GCODE_OFFSET X={tool_xoffset} Y={tool_yoffset} MOVE=1

            {% if tool_approachlocation_z > 0 %}

                SET_GCODE_OFFSET MOVE=1 Z={tool_zoffset}
                SET_GCODE_OFFSET MOVE=1 Z_ADJUST={z_adjust}

                { action_respond_info(
                    "BTC: Z offset now %f (adjusted by %f)"
                    % (tool_zoffset, z_adjust)
                ) }

            {% endif %}

        {% endif %}

        # Apply input shaper values
        SET_INPUT_SHAPER SHAPER_FREQ_X={tool_shaperfreq_x} SHAPER_FREQ_Y={tool_shaperfreq_y} SHAPER_TYPE_X={tool_shapertype_x} SHAPER_TYPE_Y={tool_shapertype_y}

        ###################################################
        # AFTER TOOL PICKUP
        ###################################################

        {% if frompickup == 1 %}

            # Lower Z back after pickup
            {% if tool_z_hop != 0 %}

                SAVE_GCODE_STATE NAME=TOOL_ZHOP_STATE
                G91
                G0 Z-{tool_z_hop}
                RESTORE_GCODE_STATE NAME=TOOL_ZHOP_STATE

            {% endif %}

        {% endif %}

    ###################################################
    # TOOL NOT DETECTED
    ###################################################

    {% else %}

        { action_respond_info("BTC: T%d not at carriage" % toolnumber) }

        SET_GCODE_VARIABLE MACRO=_btc_Variables VARIABLE=tool_current_asperbtc VALUE=-1

        {% if frompickup == 1 %}

            HOTSWAP_LED_ERROR

            {% if printer["print_stats"].state == "printing" %}

                { action_respond_info(
                    "BTC: Tool %s not detected at carriage!! Pausing print..."
                    % toolnumber
                ) }

                PAUSE

            {% else %}

                { action_raise_error(
                    "BTC: Tool %s not detected at carriage!!"
                    % toolnumber
                ) }

            {% endif %}

        {% else %}
            HOTSWAP_LED_EMPTY
        {% endif %}

    {% endif %}
### end Check state of carriage ###

### start Check dock state ###
[gcode_macro _check_dock_third]
gcode:
  {% set toolnumber = params.TOOLNUMBER|default(0)|int %}
  {% set fromdropoff = params.FROMDROPOFF|default(0)|int %}
  {% set btcvar = printer["gcode_macro _btc_Variables"] %}
  
  # VERIFY DROPOFF USING CARRIAGE SENSE (SENSOR SHOULD BE OPEN / RELEASED)
  {% set carriage_engaged = printer["gcode_button carriage_sense"].state == "PRESSED" if btcvar.carriage_sense_switch else False %}
  
  {% if not carriage_engaged %}
    { action_respond_info("BTC: T%d dropped off successfully (Carriage sensor cleared)" % (toolnumber)) }
    SET_GCODE_VARIABLE MACRO=_btc_Variables VARIABLE=tool_current_asperbtc VALUE=-1
    HOTSWAP_LED_EMPTY
    {% if fromdropoff == 1 %}
      SET_GCODE_VARIABLE MACRO=_btc_Variables VARIABLE=last_dropoff_successful VALUE=True
      SET_GCODE_VARIABLE MACRO=_btc_Variables VARIABLE=from_pickup VALUE=False
    {% endif %}
  {% else %}
    { action_respond_info("BTC: T%d dropoff failed! Tool still detected on carriage." % (toolnumber)) }
    HOTSWAP_LED_ERROR
    {% if fromdropoff == 1 %}
      {% if printer['print_stats'].state == "printing" %}
        { action_respond_info("BTC: Tool %s failed to release from carriage!! Pausing print..." % (toolnumber)) }
        pause
      {% else %}
        { action_raise_error("BTC: Tool %s failed to release from carriage!!" % (toolnumber)) }
      {% endif %}
    {% endif %}
  {% endif %}
### end Check dock state ###

### start Tool pickup routine ###
[gcode_macro Tool_Pickup]
gcode:
  {% set tool_num = params.TOOLNUMBER|default(0)|int %}
  {% if 'xy' in printer.toolhead.homed_axes %}
    _tool_pickup_second TOOLNUMBER={tool_num} FROMHOMING={params.FROMHOMING|default(0)|int}
  {% else %}
    { action_raise_error("Must home xy first!") }
  {% endif %}

[gcode_macro _tool_pickup_second]
gcode:
  {% set toolnumber = params.TOOLNUMBER|default(0)|int %}
  {% set fromhoming = params.FROMHOMING|default(0)|int %}
  {% set btcvar = printer["gcode_macro _btc_Variables"] %}
  {% set tool_z_hop = btcvar.btc_z_hop %}
  {% set tool_current_asperbtc = btcvar.tool_current_asperbtc|int %}
  {% set use_dockslide = btcvar.use_dockslide %}
  {% set performed_dropoff = False %}

  {% if tool_current_asperbtc != toolnumber %}
    {% if tool_z_hop != 0 %}
      SAVE_GCODE_STATE NAME=TOOL_ZHOP_STATE
      G91
      G0 Z{tool_z_hop}
      RESTORE_GCODE_STATE NAME=TOOL_ZHOP_STATE
    {% endif %}
    {% if tool_current_asperbtc > -1 %}
      { action_respond_info("BTC: Pickup tool %d, active tool is %d. Now dropping off active tool" % (toolnumber, tool_current_asperbtc)) }
      SET_GCODE_VARIABLE MACRO=_btc_Variables VARIABLE=from_pickup VALUE=True
      {% if fromhoming == 1 %}
        {% set toolvars = printer["gcode_macro _Variables_t" + tool_current_asperbtc|string] %}
        {% set tool_xoffset = toolvars.xoffset|float * -1 %}
        {% set tool_yoffset = toolvars.yoffset|float * -1%}
        SET_GCODE_OFFSET X={tool_xoffset} Y={tool_yoffset} move=1
      {% endif %}
      Tool_Dropoff TOOLNUMBER={tool_current_asperbtc} FROMPICKUP=1
      {% set performed_dropoff = True %}
    {% endif %}
    _tool_pickup_third TOOLNUMBER={toolnumber} FROMDROPOFF={1 if performed_dropoff else 0}
  {% else %}
    { action_respond_info("BTC: Tool %d is already on carriage." % toolnumber) }
  {% endif %}

[gcode_macro _tool_pickup_third]
gcode:
  {% set toolnumber = params.TOOLNUMBER|default(0)|int %}
  {% set performed_dropoff = params.FROMDROPOFF|default(0)|int %}
  {% set btcvar = printer["gcode_macro _btc_Variables"] %}

  {% if performed_dropoff == 0 or btcvar.last_dropoff_successful %}
    HOTSWAP_LED_PICKUP
    { action_respond_info("BTC: Pickup tool %d" % (toolnumber)) }
    {% set tool_travel_feedrate = btcvar.btc_travel_speed * 60 %}
    {% set tool_change_feedrate = btcvar.btc_toolchange_speed * 60 %}
    {% set tool_wipe_feedrate = btcvar.btc_wipe_speed * 60 %}
    {% set base_limit_accel = btcvar.base_limit_accel %}
    {% set base_limit_scv = btcvar.base_limit_scv %}
    {% set z_adjust = btcvar.gcode_offset_z_adjust %}
    {% set sling_mode = btcvar.sling_mode %}
    {% set toolvar = printer["gcode_macro _Variables_t" + toolnumber|string] %}
    {% set pickup_approachlocation = toolvar.pickup_approachlocation %}
    {% set pickup_moves = toolvar.pickup_moves %}
    {% set tool_zoffset = toolvar.zoffset %}
    {% if not sling_mode %}
      SET_GCODE_OFFSET MOVE=1 Z={tool_zoffset}
      SET_GCODE_OFFSET MOVE=1 Z_ADJUST={z_adjust}
    {% else %}
      SET_GCODE_OFFSET MOVE=1 Z=0
      SET_GCODE_OFFSET MOVE=1 Z_ADJUST=0
    {% endif %}
    { action_respond_info("BTC: Z offset now %f (adjusted by %f)" % (tool_zoffset, z_adjust)) }
    {% set last_limit_accel = printer.toolhead.max_accel %}
    {% set last_limit_scv = printer.toolhead.square_corner_velocity %}
    SET_VELOCITY_LIMIT ACCEL={base_limit_accel} SQUARE_CORNER_VELOCITY={base_limit_scv}
    SAVE_GCODE_STATE NAME=TOOL_PICKUP_STATE
    {% if pickup_approachlocation|length == 4 %}
      {% set xtxt, ytxt, ztxt = "", "", "" %}
      {% if pickup_approachlocation[0] != -128 %}
        {% set xtxt = "X" + pickup_approachlocation[0]|string %}
      {% endif %}
      {% if pickup_approachlocation[1] != -128 %}
        {% set ytxt = "Y" + pickup_approachlocation[1]|string %}
      {% endif %}
      {% if pickup_approachlocation[2] != -128 %}
        {% set ztxt = "Z" + pickup_approachlocation[2]|string %}
      {% endif %}
      { action_respond_info("BTC: Move to approach location %s %s %s F%d" % (xtxt, ytxt, ztxt, pickup_approachlocation[3] * 60)) }
      G0 {xtxt} {ytxt} {ztxt} F{pickup_approachlocation[3] * 60}
      {% for movepos in range(pickup_moves|length) %}
        {% set topos = pickup_moves[movepos].split(',') %}
        {% if topos|length == 4 %}
          {% set xtxt, ytxt, ztxt = "", "", "" %}
          {% if topos[0]|int != -128 %}
            {% set xtxt = "X" + topos[0]|string %}
          {% endif %}
          {% if topos[1]|int != -128 %}
            {% set ytxt = "Y" + topos[1]|string %}
          {% endif %}
          {% if topos[2]|int != -128 %}
            {% set ztxt = "Z" + topos[2]|string %}
          {% endif %}
          { action_respond_info("BTC: Move to position %d %s %s %s F%d" % (movepos, xtxt, ytxt, ztxt, topos[3]|int * 60)) }
          G0 {xtxt} {ytxt} {ztxt} F{topos[3]|int * 60}
        {% else %}
          { action_respond_info("BTC: Running %s" % (topos[0])) }
          {topos[0]}
        {% endif %}
      {% endfor %}
    {% else %}
      { action_raise_error("BTC: pickup_approachlocation variable not exactly 4 fields!!") }
    {% endif %}
    RESTORE_GCODE_STATE NAME=TOOL_PICKUP_STATE
    SET_VELOCITY_LIMIT ACCEL={last_limit_accel} SQUARE_CORNER_VELOCITY={last_limit_scv}
    _CHECK_CARRIAGE_SECOND TOOLNUMBER={toolnumber} FROMPICKUP=1
    _UPDATE_FRONTEND
  {% else %}
    HOTSWAP_LED_ERROR
    { action_respond_info("BTC: ERROR tool dropoff failed. Please check manually, and run T%d before continuing" % toolnumber) }
    pause
  {% endif %}
### end Tool pickup routine ###

### start Tool dropoff routine ###
[gcode_macro Tool_Dropoff]
gcode:
  SET_GCODE_VARIABLE MACRO=_btc_Variables VARIABLE=last_dropoff_successful VALUE=False
  {% set tool_num = params.TOOLNUMBER|default(0)|int %}
  {% if 'xy' in printer.toolhead.homed_axes %}
    {% if params.FROMPICKUP|default(0)|int != 1 %}
      Check_Carriage TOOLNUMBER={tool_num}
    {% else %}
      {% set frompickuptxt = "FROMPICKUP=1" %}
    {% endif %}
    _tool_dropoff_second TOOLNUMBER={tool_num} {frompickuptxt}
  {% else %}
    { action_raise_error("Must home xy first!") }
  {% endif %}
  _UPDATE_FRONTEND

[gcode_macro _tool_dropoff_second]
gcode:
  {% set toolnumber = params.TOOLNUMBER|default(0)|int %}
  {% set frompickup = params.FROMPICKUP|default(0)|int %}
  {% set btcvar = printer["gcode_macro _btc_Variables"] %}
  {% set tool_current_asperbtc = btcvar.tool_current_asperbtc|int %}
  {% set use_dockslide = btcvar.use_dockslide %}
  {% if toolnumber == tool_current_asperbtc|int %}
    { action_respond_info("BTC: Dropoff tool %d, active tool is %s - Proceeding dropoff" % (toolnumber, tool_current_asperbtc)) }
    {% set tool_travel_feedrate = btcvar.btc_travel_speed * 60 %}
    {% set tool_change_feedrate = btcvar.btc_toolchange_speed * 60 %}
    {% set base_limit_accel = btcvar.base_limit_accel %}
    {% set base_limit_scv = btcvar.base_limit_scv %}
    {% set sling_mode = btcvar.sling_mode %}
    {% set toolvar = printer["gcode_macro _Variables_t" + toolnumber|string] %}
    {% set dropoff_approachlocation = toolvar.dropoff_approachlocation %}
    {% set dropoff_moves = toolvar.dropoff_moves %}
    SET_GCODE_OFFSET MOVE=1 X=0 Y=0   #set XY offset to zero so that docking is not misaligned
    {% set last_limit_accel = printer.toolhead.max_accel %}
    {% set last_limit_scv = printer.toolhead.square_corner_velocity %}
    SET_VELOCITY_LIMIT ACCEL={base_limit_accel} SQUARE_CORNER_VELOCITY={base_limit_scv}
    SAVE_GCODE_STATE NAME=TOOL_DROPOFF_STATE
    {% if sling_mode %}
      SET_GCODE_OFFSET MOVE=1 Z=0
    {% endif %}
    {% if dropoff_approachlocation|length == 4 %}
      {% set xtxt, ytxt, ztxt = "", "", "" %}
      {% if dropoff_approachlocation[0] != -128 %}
        {% set xtxt = "X" + dropoff_approachlocation[0]|string %}
      {% endif %}
      {% if dropoff_approachlocation[1] != -128 %}
        {% set ytxt = "Y" + dropoff_approachlocation[1]|string %}
      {% endif %}
      {% if dropoff_approachlocation[2] != -128 %}
        {% set ztxt = "Z" + dropoff_approachlocation[2]|string %}
      {% endif %}
      { action_respond_info("BTC: Move to approach location %s %s %s F%d" % (xtxt, ytxt, ztxt, dropoff_approachlocation[3] * 60)) }
      G0 {xtxt} {ytxt} {ztxt} F{dropoff_approachlocation[3] * 60}
      {% for movepos in range(dropoff_moves|length) %}
        {% set topos = dropoff_moves[movepos].split(',') %}
        {% if topos|length == 4 %}
          {% set xtxt, ytxt, ztxt = "", "", "" %}
          {% if topos[0]|int != -128 %}
            {% set xtxt = "X" + topos[0]|string %}
          {% endif %}
          {% if topos[1]|int != -128 %}
            {% set ytxt = "Y" + topos[1]|string %}
          {% endif %}
          {% if topos[2]|int != -128 %}
            {% set ztxt = "Z" + topos[2]|string %}
          {% endif %}
          { action_respond_info("BTC: Move to position %d %s %s %s F%d" % (movepos, xtxt, ytxt, ztxt, topos[3]|int * 60)) }
          G0 {xtxt} {ytxt} {ztxt} F{topos[3]|int * 60}
        {% else %}
          {% if topos[0]|string != "Dockslide_Park" %}
            {topos[0]}
          {% else %}
            {% if frompickup != 1 %}
              {topos[0]}
            {% endif %}
          {% endif %}
        {% endif %}
      {% endfor %}
    {% else %}
      { action_raise_error("BTC: dropoff_approachlocation variable not exactly 4 fields!!") }
    {% endif %}
    RESTORE_GCODE_STATE NAME=TOOL_DROPOFF_STATE
    SET_VELOCITY_LIMIT ACCEL={last_limit_accel} SQUARE_CORNER_VELOCITY={last_limit_scv}
    M400
    _check_dock_third TOOLNUMBER={toolnumber} FROMDROPOFF=1
  {% else %}
    HOTSWAP_LED_ERROR
    { action_raise_error("BTC: Dropoff tool %d but active tool is %s, aborting" % (toolnumber, tool_current_asperbtc)) }
  {% endif %}
### end Tool dropoff routine ###

[gcode_macro RECOVER_WITH_TOOL]
description: Manually register Tool 1 while paused without breaking the virtual SD card connection.
gcode:
  {% set toolnumber = params.TOOL|default(-1)|int %}
  
  {% if toolnumber == -1 %}
    HOTSWAP_LED_ERROR
    { action_raise_error("BTC Recovery: You must specify a tool number! Example: RECOVER_WITH_TOOL TOOL=1") }
  {% else %}
    { action_respond_info("BTC Recovery: Updating active states for Tool %d" % toolnumber) }
    
    SET_GCODE_VARIABLE MACRO=_btc_Variables VARIABLE=tool_current_asperbtc VALUE={toolnumber}
    SET_GCODE_VARIABLE MACRO=_btc_Variables VARIABLE=last_dropoff_successful VALUE=True
    SET_GCODE_VARIABLE MACRO=_btc_Variables VARIABLE=from_pickup VALUE=False
    
    _CHECK_CARRIAGE_SECOND TOOLNUMBER={toolnumber} FROMPICKUP=0
    
    {% set toolvar = printer["gcode_macro _Variables_t" + toolnumber|string] %}
    {% set tool_x = toolvar.xoffset|float %}
    {% set tool_y = toolvar.yoffset|float %}
    {% set tool_z = toolvar.zoffset|float %}
    {% set z_adjust = printer["gcode_macro _btc_Variables"].gcode_offset_z_adjust|float %}
    
    SET_GCODE_OFFSET X={tool_x} Y={tool_y} Z={tool_z}
    SET_GCODE_OFFSET Z_ADJUST={z_adjust}
    
    _UPDATE_FRONTEND
    
    { action_respond_info("BTC Recovery: Tool registers updated. Click RESUME to let the toolhead return.") }
  {% endif %}

###################################################
# SHARED EXTRUDER PRESSURE ADVANCE
###################################################

# Convert Marlin linear advance commands and remember the value for the
# currently selected BTC tool.
[gcode_macro M900]
gcode:
    {% set pa = params.K|float %}
    {% set toolnumber = printer["gcode_macro _btc_Variables"].tool_current_asperbtc|int %}

    {% if toolnumber < 0 %}
        { action_raise_error("Cannot set pressure advance: no tool selected") }
    {% else %}
        SET_PRESSURE_ADVANCE EXTRUDER=shared_extruder ADVANCE={pa}
        SET_GCODE_VARIABLE MACRO=_Variables_t{toolnumber} VARIABLE=pressure_advance VALUE={pa}
    {% endif %}

[gcode_macro SET_PRESSURE_ADVANCE]
  rename_existing: _SET_PRESSURE_ADVANCE_BASE
  gcode:
      {% if params.EXTRUDER is defined %}
          _SET_PRESSURE_ADVANCE_BASE {rawparams}
      {% else %}
          _SET_PRESSURE_ADVANCE_BASE EXTRUDER=shared_extruder {rawparams}
      {% endif %}

# Tuning-tower helper: apply PA to the physical shared stepper without
# overwriting the selected tool's saved value on every layer.
[gcode_macro _SET_SHARED_PRESSURE_ADVANCE]
gcode:
    SET_PRESSURE_ADVANCE EXTRUDER=shared_extruder ADVANCE={params.ADVANCE|float}

[gcode_macro PA_tunning]
gcode:
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=1 ACCEL=500
    TUNING_TOWER COMMAND=_SET_SHARED_PRESSURE_ADVANCE PARAMETER=ADVANCE START=0 FACTOR=.005

[gcode_macro M109]
rename_existing: M99109
gcode:
    {% set btc_temp_allow = printer["gcode_macro _btc_Variables"].btc_temp_allow %}
    {% set s = params.S|float %}
    {% if params.T is defined %}
      {% set p = params.T|int %}
      M104 S{s} T{p}
      {% if p == 0 %}
        {% set extrudernum = "" %}
      {% else %}
        {% set extrudernum = p %}
      {% endif %}
      {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder{extrudernum} MINIMUM={s-btc_temp_allow}
      {% endif %}
    {% else %}
      M104 S{s}
      {% set toolcurrent = printer.toolhead.extruder %}
      {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR={toolcurrent} MINIMUM={s-btc_temp_allow}
      {% endif %}
    {% endif %}
### end temperature override ###

### default nozzle wiping ######################################
[gcode_macro WIPE_NOZZLE]
gcode:
  {% set direction = params.DIRECTION|default(-1)|int %}
  {% set feed = printer["gcode_macro _btc_Variables"].btc_wipe_speed * 60 %}
  {% set pos_x = printer.toolhead.position.x %}
  {% set pos_y = printer.toolhead.position.y %}

  {% if direction > 0 %} # Dock at rear
    G0 Y{pos_y - 15} F{feed}
    G0 Y{pos_y - 2}
    G0 Y{pos_y - 15}
    G0 Y{pos_y - 2}
  {% else %} # Dock at front
    G0 Y{pos_y + 15} F{feed}
    G0 Y{pos_y + 2}
    G0 Y{pos_y + 15}
    G0 Y{pos_y + 2}
  {% endif %}
### end default nozzle wiping ##################################

########################################################################################
[gcode_macro Get_Tool_States]
gcode:
  {% set carriage_state = printer["gcode_button carriage_sense"].state %}
  { action_respond_info("Carriage Sensor State: %s" % (carriage_state)) }
  { action_respond_info("Dock Sensing: Disabled (Single Carriage Switch Setup)") }
########################################################################################

[gcode_macro _Sanity_Check_Tools_Error]
gcode:
  {% set FAILURE = params.FAILURE|default(0)|int %}
  {% set PAUSE = params.PAUSE|default(0)|int %}
  {% set ERROR = params.ERROR|string %}
  HOTSWAP_LED_ERROR
  {% if FAILURE == 1 %}
    { action_raise_error(ERROR) }
  {% elif PAUSE == 1 %}
    { action_respond_info(ERROR) }
    PAUSE
  {% else %}
    { action_emergency_stop(ERROR) }
  {% endif %}

[gcode_macro Sanity_Check_Tools]
gcode:
  {% set FAILURE = params.FAILURE|default(0)|int %}
  {% set PAUSE = params.PAUSE|default(0)|int %}
  {% set active_tool = printer["gcode_macro _btc_Variables"].tool_current_asperbtc %}
  {% set carriage_engaged = printer["gcode_button carriage_sense"].state == "PRESSED" %}

  {% if carriage_engaged and active_tool == -1 %}
    HOTSWAP_LED_ERROR
    _Sanity_Check_Tools_Error FAILURE={FAILURE} PAUSE={PAUSE} ERROR="Tool detected on carriage, but no active tool is assigned in BTC variables!"
  {% elif not carriage_engaged and active_tool != -1 %}
    HOTSWAP_LED_ERROR
    _Sanity_Check_Tools_Error FAILURE={FAILURE} PAUSE={PAUSE} ERROR="Tool %d assigned as active, but no tool detected on carriage sensor!" % active_tool
  {% else %}
    { action_respond_info("Sanity check passed: Tool state matches carriage sensor.") }
  {% endif %}
########################################################################################

[gcode_macro Leds_Off]
gcode:
  HOTSWAP_LED_EMPTY