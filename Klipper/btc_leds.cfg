[neopixel carriage_light]
pin: EBBCan: PD3
chain_count: 3
color_order: GRB

[gcode_macro _BTC_LED_EMPTY]
description: Logo blue, nozzle white when carriage is empty
gcode:
  UPDATE_DELAYED_GCODE ID=_BTC_LED_BLINK_LOOP DURATION=0
  # Set Logo (LED #1) to Blue
  SET_LED LED=carriage_light RED=0 GREEN=0 BLUE=1 INDEX=1 SYNC=0
  # Set Nozzle LEDs (LED #2 & #3) to White
  SET_LED LED=carriage_light RED=1 GREEN=1 BLUE=1 INDEX=2 SYNC=0
  SET_LED LED=carriage_light RED=1 GREEN=1 BLUE=1 INDEX=3 SYNC=0

[gcode_macro _BTC_LED_SUCCESS]
description: Logo green, nozzle white after registration
gcode:
  UPDATE_DELAYED_GCODE ID=_BTC_LED_BLINK_LOOP DURATION=0
  # Set Logo (LED #1) to Green
  SET_LED LED=carriage_light RED=0 GREEN=1 BLUE=0 INDEX=1 SYNC=0
  # Set Nozzle LEDs (LED #2 & #3) to White
  SET_LED LED=carriage_light RED=1 GREEN=1 BLUE=1 INDEX=2 SYNC=0
  SET_LED LED=carriage_light RED=1 GREEN=1 BLUE=1 INDEX=3 SYNC=0

[gcode_macro _BTC_LED_BLINK_RED]
variable_blink_state: 0
gcode:
  {% if printer["gcode_macro _BTC_LED_BLINK_RED"].blink_state == 0 %}
    SET_LED LED=carriage_light RED=1 GREEN=0 BLUE=0 SYNC=0
    SET_GCODE_VARIABLE MACRO=_BTC_LED_BLINK_RED VARIABLE=blink_state VALUE=1
  {% else %}
    SET_LED LED=carriage_light RED=0 GREEN=0 BLUE=0 SYNC=0
    SET_GCODE_VARIABLE MACRO=_BTC_LED_BLINK_RED VARIABLE=blink_state VALUE=0
  {% endif %}

[delayed_gcode _BTC_LED_BLINK_LOOP]
initial_duration: 0
gcode:
  _BTC_LED_BLINK_RED
  UPDATE_DELAYED_GCODE ID=_BTC_LED_BLINK_LOOP DURATION=0.5
  
[gcode_macro HOTSWAP_LED_EMPTY]
description: Carriage empty (Status: Blue | Nozzles: White)
gcode:
    UPDATE_DELAYED_GCODE ID=_CARRIAGE_BLINK_LOOP DURATION=0
    SET_LED LED=carriage_light RED=0 GREEN=0 BLUE=1 INDEX=1 TRANSMIT=0
    SET_LED LED=carriage_light RED=1 GREEN=1 BLUE=1 INDEX=2 TRANSMIT=0
    SET_LED LED=carriage_light RED=1 GREEN=1 BLUE=1 INDEX=3 TRANSMIT=1

[gcode_macro HOTSWAP_LED_TOOL]
description: Tool mounted (Status: Green | Nozzles: White)
gcode:
    UPDATE_DELAYED_GCODE ID=_CARRIAGE_BLINK_LOOP DURATION=0
    SET_LED LED=carriage_light RED=0 GREEN=1 BLUE=0 INDEX=1 TRANSMIT=0
    SET_LED LED=carriage_light RED=1 GREEN=1 BLUE=1 INDEX=2 TRANSMIT=0
    SET_LED LED=carriage_light RED=1 GREEN=1 BLUE=1 INDEX=3 TRANSMIT=1

[gcode_macro HOTSWAP_LED_PICKUP]
description: Tool pickup in progress (Status: Orange | Nozzles: White)
gcode:
    UPDATE_DELAYED_GCODE ID=_CARRIAGE_BLINK_LOOP DURATION=0
    SET_LED LED=carriage_light RED=1 GREEN=0.35 BLUE=0 INDEX=1 TRANSMIT=0
    SET_LED LED=carriage_light RED=1 GREEN=1 BLUE=1 INDEX=2 TRANSMIT=0
    SET_LED LED=carriage_light RED=1 GREEN=1 BLUE=1 INDEX=3 TRANSMIT=1

[gcode_macro HOTSWAP_LED_ERROR]
description: Error/Failed Dropoff (Status: Red | Nozzles: Blinking Red)
variable_blink_state: 1
gcode:
    UPDATE_DELAYED_GCODE ID=_CARRIAGE_BLINK_LOOP DURATION=0
    SET_LED LED=carriage_light RED=1 GREEN=0 BLUE=0 INDEX=1 TRANSMIT=1
    SET_GCODE_VARIABLE MACRO=HOTSWAP_LED_ERROR VARIABLE=blink_state VALUE=1
    UPDATE_DELAYED_GCODE ID=_CARRIAGE_BLINK_LOOP DURATION=0.1

[delayed_gcode _CARRIAGE_BLINK_LOOP]
gcode:
    {% set state = printer["gcode_macro HOTSWAP_LED_ERROR"].blink_state %}
    {% if state == 1 %}
        SET_LED LED=carriage_light RED=1 GREEN=0 BLUE=0 INDEX=2 TRANSMIT=0
        SET_LED LED=carriage_light RED=1 GREEN=0 BLUE=0 INDEX=3 TRANSMIT=1
        SET_GCODE_VARIABLE MACRO=HOTSWAP_LED_ERROR VARIABLE=blink_state VALUE=0
    {% else %}
        SET_LED LED=carriage_light RED=0 GREEN=0 BLUE=0 INDEX=2 TRANSMIT=0
        SET_LED LED=carriage_light RED=0 GREEN=0 BLUE=0 INDEX=3 TRANSMIT=1
        SET_GCODE_VARIABLE MACRO=HOTSWAP_LED_ERROR VARIABLE=blink_state VALUE=1
    {% endif %}
    UPDATE_DELAYED_GCODE ID=_CARRIAGE_BLINK_LOOP DURATION=0.5