# TOOL 0 CONFIGURATION
# Hardware:
#  V6 CHP
#  3010 hotend fan

####################
# Tool0 Variables
[gcode_macro _VARIABLES_T0]
# Absolute pickup moves in XYZ coordinates + speed (MUST HAVE 4 fields!!)
# Accept any number of moves
# Macros accepted other than coordinates
# If using same axis position as previous move, use -128

variable_pickup_approachlocation: [20.06,100.00,-128,700]
variable_pickup_moves: ["DOCKSLIDE_DEPLOY",
						"-128,50.18,-128,700",
						"17.06,-128,-128,200",
						"-128,37.18,-128,200",
					    "20.06,-128,-128,200",
						"TOOL_RETRACT",
						"-128,100.00,-128,700",
						"DOCKSLIDE_PARK"]

variable_dropoff_approachlocation: [20.06,100.00,-128,700]
variable_dropoff_moves: ["DOCKSLIDE_DEPLOY",
						 "-128,37.18,-128,700",
						 "17.06,-128,-128,200",
						 "-128,50.18,-128,100",
						 "20.06,-128,-128,200",
						 "-128,100.00,-128,700",
						 "DOCKSLIDE_PARK"]

variable_xoffset: 0              # For tool 0, offsets are all 0
variable_yoffset: 0              # 
variable_zoffset: 0              # 
variable_shaperfreq_x: 67.6      # Tool 0 input shaper
variable_shaperfreq_y: 44.8      # 
variable_shapertype_x: "mzv"     # 
variable_shapertype_y: "mzv"      # 

# End of section options
#######################################################

variable_pressure_advance: 0.0
gcode:

# Tool 0 hotend. The physical extruder motor is defined separately below
# because it is shared by every hotend.
[extruder]
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 1400.0
max_extrude_only_velocity: 75.0
max_extrude_only_accel: 8700
max_extrude_cross_section: 500
heater_pin: PA0
sensor_type: ATC Semitec 104GT-2
sensor_pin: PF4
#pullup_resistor: 2200
min_temp: 10
max_temp: 300
min_extrude_temp: 170
control = pid
pid_Kp: 23.505
pid_Ki: 1.004
pid_Kd: 137.505

[heater_fan hotend_fan0]
pin: PA8
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 60.0

#####################################################################
# TOOL 0 EXECUTION MACRO (Klipper accepts both T0 and t0 commands)	#
#####################################################################

[gcode_macro T0]
variable_spool_id: None
variable_active: False
gcode:
  TOOL_PICKUP TOOLNUMBER=0
  ACTIVATE_EXTRUDER EXTRUDER=extruder

  {% if spool_id is not none %}
    SET_ACTIVE_SPOOL ID={spool_id}
  {% else %}
    CLEAR_ACTIVE_SPOOL
  {% endif %}