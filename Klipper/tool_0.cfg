# TOOL 0 CONFIGURATION
# Hardware:
#  Toolhead: r2.1
#  V6 CHP
#  Sherpa Micro
#  Ebb 36
#  3010 hotend fan

####################
# Tool0 Variables
[gcode_macro _Variables_t0]
# Absolute pickup moves in XYZ coordinates + speed (MUST HAVE 4 fields!!)
# Accept any number of moves
# Macros accepted other than coordinates
# If using same axis position as previous move, use -128

variable_pickup_approachlocation: [108,90,-128,700] # Absolute pickup location in XYZ coordinates + speed
variable_pickup_moves: ["Dockslide_Deploy",
                        "-128,52,-128,700",
                        "105,-128,-128,400",
                        "-128,38,-128,400",
                        "108,-128,-128,400",
                        "M400",
                        # "WIPE_NOZZLE DIRECTION=-1",
                        "-128,90,-128,700",
                        "Dockslide_Park"]

variable_dropoff_approachlocation: [108,90,-128,700] # Absolute dropoff location in XYZ coordinates + speed
variable_dropoff_moves: ["Dockslide_Deploy",
                        "-128,38,-128,700",
                        "105,-128,-128,400",
                        "-128,52,-128,700",
                        "108,-128,-128,400",
                        "-128,90,-128,700",
                        "Dockslide_Park"]

variable_xoffset: 0              # For tool 0, offsets are all 0
variable_yoffset: 0              # 
variable_zoffset: 0              # 
variable_shaperfreq_x: 67.6      # Tool 0 input shaper
variable_shaperfreq_y: 44.8      # 
variable_shapertype_x: "mzv"     # 
variable_shapertype_y: "mzv"      # 

variable_leds_toolhead: "1"
variable_leds_nozzle: "2,3"

# End of section options
#######################################################

variable_pressure_advance: 0.0
gcode:

# Tool 0 hotend. The physical extruder motor is defined separately below
# because it is shared by every hotend.
[extruder]
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 1400.0
max_extrude_only_velocity: 75.0
max_extrude_only_accel: 8700
max_extrude_cross_section: 500
heater_pin: PB0
sensor_type: ATC Semitec 104GT-2
sensor_pin: PF6
#pullup_resistor: 2200
min_temp: 10
max_temp: 300
min_extrude_temp: 170
control = pid
pid_Kp: 24.520
pid_Ki: 1.048
pid_Kd: 143.439

[heater_fan hotend_fan0]
pin: PA8
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 60.0

#####################################################################
# TOOL 0 EXECUTION MACROS (Both T0 and t0 for UI/Console compatibility)
#####################################################################

[gcode_macro t0]
variable_spool_id: None
variable_active: False
gcode:
  Tool_Pickup TOOLNUMBER=0
