# ============================================================
# Lineux Hotswap Dock Location Calibration
# ============================================================
[dock_locate_calibrate]

# ------------------------------------------------------------
# MCU position resolution
# ------------------------------------------------------------
# This depends on the printer's stepper configuration.
# Current value for this calibration:
#   
#   rotation_distance: 40
#   full_steps_per_rotation: 200
#
# If you use a different value above, you must do your own
# calculation and change the xy_resolution yourself.

xy_resolution: 0.0125           # Uncomment this if using 16 microsteps
# xy_resolution: 0.00625        # Uncomment this if using 32 microsteps
# xy_resolution: 0.003125       # Uncomment this if using 64 microsteps

# ------------------------------------------------------------
# Printer X/Y homing positions
# ------------------------------------------------------------
# IMPORTANT:
# These are the actual X/Y position_endstop values.
# They are NOT the bed size and NOT position_max.
x_endstop: 330
y_endstop: 320

# ------------------------------------------------------------
# Calibration movement
# ------------------------------------------------------------
# Distance and direction the carriage moves before homing.
# Positive = X positive direction
# Negative = X negative direction
# Example:
#   3.0  = move X +3mm
#  -3.0  = move X -3mm
calibrate_move_x: 3.0

# ============================================================
# Fluidd Button
# ============================================================
[gcode_macro DOCK_CALIBRATION]
description: Start Lineux Hotswap Dock Location Calibration
gcode:
    DOCK_LOCATE_CALIBRATE